<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyMovie – Book 2026 Movie Tickets Online | Tamil &amp; Hollywood</title>
    <meta name="description" content="BookMyMovie – Browse recent and upcoming 2026 Tamil and Hollywood movies, select theatres, showtimes, and book seats." />

    <!-- ==============================================================================
         Experiment 2: Basic PWA Support (Requirement d)
         ============================================================================== -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e50914" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BookMyMovie" />
    <link rel="apple-touch-icon" href="/bookmymovie-icon.svg" />

    <!-- ==============================================================================
         Experiment 2: Performance & Image Preconnect (Requirement c)
         ============================================================================== -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />

    <!-- ==============================================================================
         Experiment 2: Front-End Security & CSP (Requirement f)
         ============================================================================== -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.restful-api.dev https://api.themoviedb.org https://image.tmdb.org https://api.tvmaze.com http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* wss:; worker-src 'self' blob:;" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
